name: Security Baseline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays at 4:00 AM

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks-action
        uses: zricethezav/gitleaks-action@v2

  dependency-audit:
    name: PNPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run audit
        run: pnpm audit --prod

  zap-scan:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    # This step is commented out until a staging environment URL is available
    # steps:
    #   - name: ZAP Scan
    #     uses: zaproxy/action-baseline@v0.12.0
    #     with:
    #       token: ${{ secrets.GITHUB_TOKEN }}
    #       target: 'https://staging.example.com'
    steps:
      - run: echo "ZAP scan stubbed until staging environment is available."
